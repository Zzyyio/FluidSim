
name: Deploy FluidSim to Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluidsim-portfolio-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout FluidSim source
      - name: Checkout FluidSim
        uses: actions/checkout@v4
        with:
          path: fluid

      # 2. Checkout the main website
      - name: Checkout Portfolio
        uses: actions/checkout@v4
        with:
          repository: Zzyyio/Zzyyio.github.io
          ref: main
          token: ${{ secrets.PORTFOLIO_DEPLOY_TOKEN }}
          path: site

      # 3. Prepare static website files
      - name: Prepare static files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy

          rsync -av --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --include='*/' \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' \
            --include='*.mjs' \
            --include='*.glsl' \
            --include='*.json' \
            --include='*.wasm' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.webp' \
            --include='*.svg' \
            --include='*.ico' \
            --include='*.woff' \
            --include='*.woff2' \
            --exclude='*' \
            fluid/ deploy/

          test -f deploy/index.html

          mkdir -p site/public/projects/fluid-sim

          rsync -av --delete \
            deploy/ \
            site/public/projects/fluid-sim/

      # 4. Commit and push to the main website
      - name: Commit and push
        working-directory: site
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- public/projects/fluid-sim

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m \
            "chore: sync FluidSim ${SOURCE_SHA:0:7}"

          git push origin HEAD:main
